name: Build NAC Quotation APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build installable debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon
          echo "Built APK files:"
          find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print
          test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare APK for artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/NAC-Quotation-Manager.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NAC-Quotation-APK
          path: android/app/build/outputs/apk/debug/NAC-Quotation-Manager.apk
          if-no-files-found: error
